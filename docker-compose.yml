version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      # This explicitly tells Go to connect to the "db" container instead of localhost!
      - DB_HOST=db
    depends_on:
      - db
    # We add a 3 second delay to give Postgres completely enough time to boot up before the API connects.
    entrypoint: ["sh", "-c", "sleep 3 && ./gobank --seed"]

volumes:
  # This makes your database permanent so restarting Docker doesn't wipe your bank accounts!
  postgres_data:
